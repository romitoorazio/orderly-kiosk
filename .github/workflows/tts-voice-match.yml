name: TTS voice match

on:
  push:
    branches:
      - agent/tts-voice-match-test

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install edge-tts
        run: python -m pip install --upgrade edge-tts
      - name: Generate Elsa rate samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tts-samples
          for rate in 0 10 20 30 40 45 50 55 60; do
            if [ "$rate" = "0" ]; then
              edge-tts --voice it-IT-ElsaNeural --text "Numero sette" --write-media "tts-samples/Elsa_rate_0.mp3"
            else
              edge-tts --voice it-IT-ElsaNeural --rate="-${rate}%" --text "Numero sette" --write-media "tts-samples/Elsa_rate_minus_${rate}.mp3"
            fi
          done
          for rate in 40 50; do
            edge-tts --voice it-IT-IsabellaNeural --rate="-${rate}%" --text "Numero sette" --write-media "tts-samples/Isabella_rate_minus_${rate}.mp3"
          done
          ls -lh tts-samples
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: tts-rate-match-samples
          path: tts-samples/*.mp3
          if-no-files-found: error
