name: TTS voice match

on:
  push:
    branches:
      - agent/tts-voice-match-test

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install edge-tts
        run: python -m pip install --upgrade edge-tts
      - name: Generate final numbers 1-99
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p numbers
          for n in $(seq 1 99); do
            file=$(printf 'numero-%02d.mp3' "$n")
            echo "Generating Numero $n -> $file"
            edge-tts \
              --voice it-IT-ElsaNeural \
              --rate='+0%' \
              --volume='+0%' \
              --pitch='+0Hz' \
              --text "Numero $n" \
              --write-media "numbers/$file"
          done
          ls -lh numbers | tail
      - name: Upload final number set
        uses: actions/upload-artifact@v4
        with:
          name: totem-numbers-elsa-1-99
          path: numbers/*.mp3
          if-no-files-found: error
